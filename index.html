<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Denied</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
      padding: 34px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 8vw, 34px);
      letter-spacing: .02em;
      line-height: 1.1;
      word-break: break-word;
    }

    .message {
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .steps {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px 20px;
    }

    .steps strong {
      display: block;
      margin-bottom: 10px;
    }

    ol {
      margin: 0;
      padding-left: 22px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        place-items: start center;
      }

      .card {
        margin-top: 24px;
        padding: 24px 18px;
        border-radius: 12px;
      }

      .badge {
        font-size: 11px;
        margin-bottom: 14px;
      }

      .message {
        font-size: 15px;
        margin-bottom: 20px;
      }

      .steps {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Security Notice</div>

    <h1>ACCESS DENIED</h1>

    <p class="message">
      Your request could not be completed because access to this service is currently restricted.
    </p>

    <section class="steps">
      <strong>Steps required:</strong>
      <ol>
        <li>Remove contamination</li>
        <li>Remove moisture</li>
      </ol>
    </section>

    <div class="footer">
      Error code: 403 · Contact your administrator if you believe this is a mistake.
    </div>
  </main>
</body>
</html>
